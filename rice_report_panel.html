<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Requirement Report Panel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .report-header { text-align: center; margin-bottom: 20px; color: #0d6efd; font-weight: 700; }
        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th { background-color: #0d6efd !important; color: white; text-align: center; font-size: 14px; }
        td { text-align: center; vertical-align: middle; font-size: 14px; }
        .btn-back { margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="container-fluid">
    <a href="index.html" class="btn btn-outline-secondary btn-sm btn-back">&larr; Back to Dashboard</a>
    <h2 class="report-header">Rice Requirement Report Status</h2>

    <div class="table-container table-responsive">
        <table class="table table-bordered table-striped table-hover">
            <thead>
                <tr>
                    <th>SL No</th>
                    <th>School Name</th>
                    <th>Circle</th>
                    <th>GP Name</th>
                    <th>Bal Vatika (KG)</th>
                    <th>Primary (KG)</th>
                    <th>Upper Primary (KG)</th>
                    <th>Total Rice (KG)</th>
                    <th>Total Bags</th>
                    <th>Month</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <tr><td colspan="10" class="text-center text-muted py-4">Loading reports...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadReportPanel() {
        const tbody = document.getElementById('reportTableBody');
        try {
            const res = await fetch('/api/rice/panel-data', { cache: 'no-store' });
            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }
            const json = await res.json();
            const data = json.data || [];

            if (data.length > 0) {
                tbody.innerHTML = '';
                data.forEach((row, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.sl_no || (idx + 1)}</td>
                        <td class="text-start">${escapeHtml(row.school_name || '')}</td>
                        <td>${escapeHtml(row.circle_name || '')}</td>
                        <td>${escapeHtml(row.gp_name || '')}</td>
                        <td>${row.rice_req_balvatika || 0}</td>
                        <td>${row.rice_req_primary || 0}</td>
                        <td>${row.rice_req_upperprimary || 0}</td>
                        <td class="fw-bold text-primary">${row.total_rice || 0}</td>
                        <td>${row.total_bag || 0}</td>
                        <td>${escapeHtml(row.month_name || '')}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger fw-bold">কোনো রিপোর্ট পাওয়া যায়নি (No Data Found)</td></tr>';
            }
        } catch (err) {
            console.error('Error loading report panel:', err);
            tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger fw-bold">Failed to load reports from database.</td></tr>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', loadReportPanel);
</script>

</body>
</html>
