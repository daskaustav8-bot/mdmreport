<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PM POSHAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-icon {
            font-size: 50px;
            color: #4f46e5;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 56, 202, 0.3);
        }

        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #4f46e5;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #4f46e5;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-icon"><i class="fas fa-user-shield"></i></div>
        <h2 class="title">Admin Login</h2>
        <p class="subtitle">Sign in to manage reports & uploads.</p>

        <div id="error-msg" class="error-msg" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i> <span id="error-text"></span>
        </div>

        <form id="loginForm" method="POST" action="/api/auth/login">
            <input type="hidden" name="admin_type" value="main">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
                <div id="capsWarning" style="display: none; color: #d97706; font-size: 12px; margin-top: 6px; font-weight: 500;">
                    <i class="fas fa-exclamation-triangle"></i> Caps Lock is ON
                </div>
            </div>
            <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
        </form>

        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Return to Dashboard</a>
    </div>

    <script>
        // Server-side authentication check for already logged-in administrators
        (function checkAuth() {
            if (window.location.protocol === 'file:') return;
            const endpoint = (window.location.origin && window.location.origin !== 'null') ? '/api/auth/session?admin_type=main' : 'http://localhost:3000/api/auth/session?admin_type=main';
            fetch(endpoint, {
                cache: 'no-store',
                credentials: 'same-origin'
            })
            .then(function (response) {
                if (response.status === 404) {
                    return fetch('admin_session_check.php').then(r => r.json());
                }
                if (response.ok) {
                    return response.json();
                }
                return null;
            })
            .then(function (data) {
                if (data && data.authenticated && data.admin_type === 'main') {
                    try {
                        sessionStorage.setItem('admin_logged_in', 'true');
                        if (data.username) {
                            sessionStorage.setItem('admin_user', data.username);
                        }
                    } catch (e) {}
                    window.location.replace(data.redirect || '/admin_dashboard');
                } else {
                    try {
                        sessionStorage.removeItem('admin_logged_in');
                        sessionStorage.removeItem('admin_user');
                    } catch (e) {}
                }
            })
            .catch(function (err) {
                console.warn('Session check error:', err);
            });
        })();

        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            const capsWarning = document.getElementById('capsWarning');
            function checkCapsLock(e) {
                if (e.getModifierState && e.getModifierState('CapsLock')) {
                    capsWarning.style.display = 'block';
                } else {
                    capsWarning.style.display = 'none';
                }
            }
            passwordInput.addEventListener('keyup', checkCapsLock);
            passwordInput.addEventListener('keydown', checkCapsLock);
        }

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('username');

        function showError(msg) {
            errorText.textContent = msg || 'Invalid Username or Password!';
            errorMsg.style.display = 'flex';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }

        // Check URL parameters for errors (e.g., from fallback non-JS submission)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            showError(urlParams.get('error'));
        }

        usernameInput.addEventListener('input', hideError);
        passwordInput.addEventListener('input', hideError);

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            hideError();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Invalid Username or Password!');
                return;
            }

            loginBtn.disabled = true;
            const originalBtnText = loginBtn.textContent;
            loginBtn.textContent = 'Sign In...';

            const payload = {
                username: username,
                password: password,
                admin_type: 'main'
            };

            const authUrl = (window.location.protocol === 'file:') ? 'http://localhost:3000/api/auth/login' : '/api/auth/login';
            fetch(authUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(payload),
                credentials: 'same-origin'
            })
            .then(function (response) {
                if (response.status === 404 && window.location.protocol !== 'file:') {
                    return fetch('admin_login_handler.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    }).then(function (phpRes) {
                        return phpRes.json().then(function (d) {
                            return { status: phpRes.status, ok: phpRes.ok, data: d };
                        });
                    });
                }
                return response.json().then(function (data) {
                    return { status: response.status, ok: response.ok, data: data };
                }).catch(function () {
                    return { status: response.status, ok: response.ok, data: null };
                });
            })
            .then(function (res) {
                if (res.ok && res.data && res.data.success) {
                    try {
                        sessionStorage.setItem('admin_logged_in', 'true');
                        if (res.data.username) {
                            sessionStorage.setItem('admin_user', res.data.username);
                        }
                    } catch (e) {}
                    window.location.href = res.data.redirect || '/admin_dashboard';
                } else {
                    const msg = (res.data && res.data.error) ? res.data.error : 'Invalid Username or Password!';
                    showError(msg);
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalBtnText;
                }
            })
            .catch(function (err) {
                console.error('Login error:', err);
                showError('Invalid Username or Password!');
                loginBtn.disabled = false;
                loginBtn.textContent = originalBtnText;
            });
        });
    </script>

</body>

</html>
